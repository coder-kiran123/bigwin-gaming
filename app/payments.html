<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Payments – BigWin Gaming</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0e0e">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="app" data-page="payments">
  <div class="app-shell">

    <!-- ===== Top bar ===== -->
    <header class="app-top">
      <div class="avatar avatar--gold" id="profile-avatar">BW<span class="status"></span></div>
      <div class="app-top__text">
        <h1 data-brand>BigWin Gaming</h1>
        <p id="welcome-name">Welcome</p>
      </div>
      <button class="upload-btn" type="button" aria-label="Upload profile image">Upload<br>image
        <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <input type="file" id="upload-input" accept="image/*" hidden>
    </header>

    <main>
      <!-- Step 1–3: choose what to load -->
      <form id="f-load" class="panel stack gap-20" novalidate>
        <div>
          <h2 class="step-title"><span>1</span>Choose your game</h2>
          <div class="pick-grid pick-grid--games" id="pick-game" role="radiogroup" aria-label="Game"></div>
        </div>

        <div class="field">
          <h2 class="step-title"><span>2</span><label for="load-amount">Amount</label></h2>
          <input class="input input--big" id="load-amount" type="number" min="5" step="1" inputmode="decimal" placeholder="$0">
          <div class="amounts" data-for="load-amount">
            <button type="button" data-amount="10">$10</button><button type="button" data-amount="20">$20</button>
            <button type="button" data-amount="50">$50</button><button type="button" data-amount="100">$100</button>
          </div>
        </div>

        <div>
          <h2 class="step-title"><span>3</span>Pay with</h2>
          <div class="pick-grid pick-grid--methods" id="pick-method" role="radiogroup" aria-label="Payment method"></div>
        </div>

        <button type="submit" class="btn btn--gold btn--block btn--lg-mobile" id="load-continue">Continue to pay</button>
      </form>

      <!-- Step 4: how to pay + "I've paid" -->
      <section id="pay-box" class="panel pay-box" hidden>
        <button class="back-link" type="button" id="pay-back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>Change</button>
        <div class="pay-sum" id="pay-sum"></div>
        <div id="pay-details"></div>
        <div class="field mt-24">
          <label for="pay-shot">Payment screenshot <span class="text-muted">(recommended)</span></label>
          <input class="input input--file" id="pay-shot" type="file" accept="image/*">
          <p class="hint">A screenshot of your receipt helps us load you faster.</p>
        </div>
        <button type="button" class="btn btn--gold btn--block mt-24" id="pay-done">I've paid — load my game</button>
      </section>

      <!-- Done -->
      <section id="pay-ok" class="panel pay-ok" hidden>
        <div class="pay-ok__icon">✓</div>
        <h2>Request sent!</h2>
        <p class="text-muted" id="pay-ok-text"></p>
        <div class="stack gap-12 mt-24">
          <a class="btn btn--gold btn--block" href="chats.html">Open chat</a>
          <button type="button" class="btn btn--dark btn--block" id="pay-again">Load another game</button>
        </div>
      </section>

      <section class="panel">
        <h2>Your loads</h2>
        <div id="pay-history"><p class="empty">Loading…</p></div>
      </section>
    </main>
  </div>

  <!-- ===== Bottom tab bar ===== -->
  <nav class="tabbar" aria-label="App">
    <div class="tabbar__inner">
      <a class="tab" href="chats.html">Chats</a>
      <a class="tab" href="payments.html" aria-current="page">Payments</a>
      <a class="tab" href="game-id.html">Game ID</a>
    </div>
  </nav>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
